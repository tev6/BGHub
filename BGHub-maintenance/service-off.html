<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务暂时不可用 - BG Hub</title>
    <script>
    (function() {
      var saved = localStorage.getItem('bigz-hub-theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
    </script>
    <link rel="stylesheet" href="/css/style.css">
    <style>
    .service-off-container {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .service-off-content {
      max-width: 560px;
    }

    .service-off-icon {
      font-size: 5rem;
      margin-bottom: 1.5rem;
    }

    .service-off-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 1rem;
    }

    .service-off-message {
      font-size: 1.1rem;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(220, 38, 38, 0.12);
      color: var(--danger);
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .error-details {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 2rem;
      text-align: left;
    }

    .error-details h3 {
      font-size: 1rem;
      color: var(--danger);
      margin-bottom: 12px;
    }

    .error-details ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .error-details li {
      padding: 8px 0;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .contact-info {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.9rem;
    }

    .contact-info a {
      color: var(--primary);
      font-weight: 600;
    }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-shell">
            <a href="/" class="brand-group">
                <div class="logo-link">
                    <img src="/images/logo-light.svg" alt="BG Hub" class="site-logo site-logo-light">
                    <img src="/images/logo-dark.svg" alt="BG Hub" class="site-logo site-logo-dark">
                </div>
            </a>
            <div class="header-actions">
                <button class="theme-toggle" type="button" onclick="ThemeManager.toggle()" aria-label="Toggle theme">
                    <span class="theme-icon-dark" style="display:none">☀️</span>
                    <span class="theme-icon-light">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container service-off-container">
        <div class="service-off-content">
            <div class="service-off-icon">⚠️</div>
            <h1 class="service-off-title">服务暂时不可用</h1>
            <p class="service-off-message">
                抱歉，BG Hub 目前遇到了技术问题。<br>
                我们的团队已经收到通知，正在紧急处理中。
            </p>

            <div class="status-badge">服务中断</div>

            <div class="error-details">
                <h3>可能的原因</h3>
                <ul>
                    <li>服务器正在重启或维护中</li>
                    <li>网络连接出现问题</li>
                    <li>系统资源暂时不可用</li>
                </ul>
            </div>

            <a href="/" class="btn btn-primary" onclick="location.reload(); return false;">重新加载页面</a>

            <div class="contact-info">
                <p>如需紧急帮助，请联系系统管理员：<a href="mailto:admin@bghub.com">admin@bghub.com</a></p>
            </div>
        </div>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
