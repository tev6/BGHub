<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站维护中 - BG Hub</title>
    <script>
    (function() {
      var saved = localStorage.getItem('bigz-hub-theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
    </script>
    <link rel="stylesheet" href="/css/style.css">
    <style>
    .maintenance-container {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .maintenance-content {
      max-width: 560px;
    }

    .maintenance-icon {
      font-size: 5rem;
      margin-bottom: 1.5rem;
    }

    .maintenance-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 1rem;
    }

    .maintenance-message {
      font-size: 1.1rem;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(217, 119, 6, 0.12);
      color: var(--warning);
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .maintenance-details {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 2rem;
      text-align: left;
    }

    .maintenance-details h3 {
      font-size: 1rem;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .maintenance-details ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .maintenance-details li {
      padding: 8px 0;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .contact-info {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.9rem;
    }

    .contact-info a {
      color: var(--primary);
      font-weight: 600;
    }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-shell">
            <a href="/" class="brand-group">
                <div class="logo-link">
                    <img src="/images/logo-light.svg" alt="BG Hub" class="site-logo site-logo-light">
                    <img src="/images/logo-dark.svg" alt="BG Hub" class="site-logo site-logo-dark">
                </div>
            </a>
            <div class="header-actions">
                <button class="theme-toggle" type="button" onclick="ThemeManager.toggle()" aria-label="Toggle theme">
                    <span class="theme-icon-dark" style="display:none">☀️</span>
                    <span class="theme-icon-light">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container maintenance-container">
        <div class="maintenance-content">
            <div class="maintenance-icon">🔧</div>
            <h1 class="maintenance-title">网站正在维护中</h1>
            <p class="maintenance-message">
                我们正在对 BG Hub 进行定期维护，以提升服务质量和稳定性。<br>
                请稍后再试，感谢您的耐心等待。
            </p>

            <div class="status-badge">维护进行中</div>

            <div class="maintenance-details">
                <h3>本次维护内容</h3>
                <ul>
                    <li>数据库性能优化与安全更新</li>
                    <li>服务器性能调优</li>
                    <li>安全漏洞修复与系统升级</li>
                </ul>
            </div>

            <a href="/" class="btn btn-primary">返回主页</a>

            <div class="contact-info">
                <p>如有紧急情况，请联系系统管理员：<a href="mailto:admin@bghub.com">admin@bghub.com</a></p>
            </div>
        </div>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
